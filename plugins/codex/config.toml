# cdp MCP server for Codex.
#
# Append this block to ~/.codex/config.toml (or run the `codex mcp add`
# command shown in plugins/codex/README.md).
#
# Prerequisite: install the cdp binary and put your Go bin directory on PATH:
#   go install github.com/tmc/cdp/cmd/cdp@latest

[mcp_servers.cdp]
command = "cdp"
args = ["-mcp", "-headless"]
