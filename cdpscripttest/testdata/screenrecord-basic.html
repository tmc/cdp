<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Screenrecord Fixture</title>
<style>
body {
	font-family: sans-serif;
	margin: 2rem;
}

#box {
	width: 120px;
	height: 80px;
	background: #2563eb;
	color: white;
	display: grid;
	place-items: center;
	animation: pulse 600ms linear infinite alternate;
}

@keyframes pulse {
	from { transform: translateX(0); }
	to { transform: translateX(80px); }
}
</style>
</head>
<body>
<main>
	<h1>Screenrecord Fixture</h1>
	<div id="box">recording</div>
</main>
</body>
</html>
