<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Network HAR Fixture</title>
<script>
window.addEventListener("DOMContentLoaded", async function() {
	const status = document.getElementById("status");
	try {
		const response = await fetch("/interaction/pages/har-data.json");
		const data = await response.json();
		status.textContent = data.message;
		status.className = "done";
	} catch (err) {
		status.textContent = "failed";
		status.className = "failed";
	}
});
</script>
</head>
<body>
<main>
	<h1>Network HAR Fixture</h1>
	<p id="status" class="pending">pending</p>
</main>
</body>
</html>
