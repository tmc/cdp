<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Observe Act Verify</title>
  <style>
    body {
      font: 16px system-ui, sans-serif;
      margin: 0;
      background: #f7f7f2;
      color: #202020;
    }
    #target {
      position: absolute;
      left: 40px;
      top: 40px;
      width: 150px;
      height: 80px;
      border: 2px solid #2451a6;
      background: #e4edff;
      color: #10264f;
      font: inherit;
    }
    #result {
      position: absolute;
      left: 40px;
      top: 150px;
      padding: 14px 18px;
      border: 2px solid #207244;
      background: #ddf6e7;
      color: #123820;
      visibility: hidden;
    }
    body.done {
      background: #f3fbf5;
    }
    body.done #result {
      visibility: visible;
    }
  </style>
</head>
<body>
  <button id="target">Click target</button>
  <div id="result">Waiting</div>
  <script>
    document.getElementById("target").addEventListener("click", () => {
      document.body.classList.add("done");
      document.getElementById("result").textContent = "Coordinate click verified";
    });
  </script>
</body>
</html>
