<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Coordinate Compositor Surfaces</title>
<style>
body {
	margin: 0;
	font-family: sans-serif;
}

#shadow-host {
	position: absolute;
	left: 40px;
	top: 40px;
	width: 220px;
	height: 70px;
}

#shadow-status,
#frame-status {
	position: absolute;
	left: 320px;
	padding: 0.5rem 0.75rem;
	border: 1px solid #9aacbf;
	background: #f4f7fb;
}

#shadow-status {
	top: 55px;
}

#frame-status {
	top: 185px;
}

iframe {
	position: absolute;
	left: 40px;
	top: 160px;
	width: 260px;
	height: 100px;
	border: 2px solid #6688aa;
}
</style>
<script>
window.addEventListener("DOMContentLoaded", function() {
	const host = document.getElementById("shadow-host");
	const root = host.attachShadow({mode: "closed"});
	root.innerHTML = `
		<style>
		button {
			width: 100%;
			height: 100%;
			font: inherit;
			background: #e8f4ec;
			border: 1px solid #80a889;
		}
		</style>
		<button type="button">Closed Shadow Button</button>
	`;
	root.querySelector("button").addEventListener("click", function() {
		const status = document.getElementById("shadow-status");
		status.textContent = "shadow activated";
		status.className = "done";
	});

	window.addEventListener("message", function(event) {
		if (event.data !== "iframe activated") {
			return;
		}
		const status = document.getElementById("frame-status");
		status.textContent = "iframe activated";
		status.className = "done";
	});
});
</script>
</head>
<body>
<main>
	<h1 hidden>Coordinate Compositor Surfaces</h1>
	<div id="shadow-host"></div>
	<p id="shadow-status" class="pending">shadow pending</p>
	<iframe title="coordinate frame" src="/interaction/pages/coordinate-frame.html"></iframe>
	<p id="frame-status" class="pending">iframe pending</p>
</main>
</body>
</html>
