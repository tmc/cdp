<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Coordinate Click Fixture</title>
<style>
body {
	margin: 0;
	font-family: sans-serif;
}

#target {
	position: absolute;
	left: 80px;
	top: 80px;
	width: 160px;
	height: 64px;
}

#result {
	display: none;
	position: absolute;
	left: 80px;
	top: 170px;
	padding: 0.75rem;
	background: #eef6ee;
	border: 1px solid #8fb38f;
}
</style>
<script>
window.addEventListener("DOMContentLoaded", function() {
	document.getElementById("target").addEventListener("click", function() {
		const result = document.getElementById("result");
		result.textContent = "Coordinate activated";
		result.style.display = "block";
	});
});
</script>
</head>
<body>
<button id="target" type="button">Coordinate Target</button>
<p id="result" aria-live="polite"></p>
</body>
</html>
