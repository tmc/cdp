<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Coordinate Frame</title>
<style>
body {
	margin: 0;
	font-family: sans-serif;
}

button {
	position: absolute;
	left: 20px;
	top: 20px;
	width: 180px;
	height: 50px;
	background: #eef6ff;
	border: 1px solid #7799bb;
	font: inherit;
}
</style>
<script>
window.addEventListener("DOMContentLoaded", function() {
	document.querySelector("button").addEventListener("click", function() {
		parent.postMessage("iframe activated", "*");
	});
});
</script>
</head>
<body>
<button type="button">Iframe Button</button>
</body>
</html>
