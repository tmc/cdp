<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Block Script Fixture</title>
<style>
body {
	font-family: sans-serif;
	margin: 2rem;
}

#status {
	display: none;
	padding: 0.75rem;
	background: #fff6d8;
	border: 1px solid #d9ba5f;
}
</style>
<script>
function setStatus(text) {
	const status = document.getElementById("status");
	status.textContent = text;
	status.style.display = "block";
}
</script>
</head>
<body>
<main>
	<h1>Blocking Fixture</h1>
	<p id="status" aria-live="polite"></p>
	<script src="/interaction/pages/assets/feature.js" onerror="setStatus('blocked')"></script>
</main>
</body>
</html>
