<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Coverage Fixture</title>
<style>
#status {
	display: block;
}
</style>
<script>

	document.getElementById("status").textContent = "covered";
}

window.addEventListener("DOMContentLoaded", markCovered);
</script>
</head>

<p id="status">pending</p>
</body>
</html>
